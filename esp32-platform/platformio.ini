; ============================================================
;  esp32-boiler-room — прошивка котельной (KC868-A16)
;  Архитектура: см. boiler-room-v2-tz.md
; ============================================================

[env:boiler-room]
platform = espressif32 @ 6.11.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_protocol = espota
upload_port = 192.168.88.10

board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs

lib_deps =
    ottowinter/ESPAsyncWebServer-esphome @ ^3.1.0
    esphome/AsyncTCP-esphome @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0
    knolleary/PubSubClient @ ^2.8
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0

build_flags =
    -D CORE_DEBUG_LEVEL=3

    ; ---------- Модули (закомментируй чтобы отключить) ----------
    -D MODULE_MQTT
    -D MODULE_OTA
    -D MODULE_TIME
    -D TIME_SOURCE_NTP
    -D MODULE_RS485

    ; ---------- Устройства ---------------------------------------
    -D DEVICE_A16
    -D DEVICE_EKONOM
    -D DEVICE_PUMPSLAVE

    ; ---------- Приложение ----------------------------------------
    -D APP_BOILER_ROOM

    ; ---------- Железо (KC868-A16, Ethernet) -----------------------
    -D ETH_ADDR=0
    -D ETH_POWER_PIN=-1
    -D ETH_MDC_PIN=23
    -D ETH_MDIO_PIN=18
    -D ETH_CLK_MODE=ETH_CLOCK_GPIO17_OUT

    ; ---------- RS485 (EkoNom) --------------------------------------
    -D RS485_RX_PIN=16
    -D RS485_TX_PIN=13

    ; ---------- I2C (PumpSlave, Pro Mini, addr 0x30) -----------------
    -D PUMPSLAVE_I2C_ADDR=0x30

    ; ---------- Include paths ----------------------------------------
    -I src/core
    -I src/modules/mqtt
    -I src/modules/time
    -I src/modules/rs485
    -I src/devices/a16
    -I src/devices/ekonom
    -I src/devices/pumpslave
    -I src/apps/boiler-room

; ============================================================
;  Первая заливка на новую плату — по USB (см. чат: партиции свои,
;  min_spiffs.csv, по OTA таблица разделов не переписывается).
;  На месте поправь upload_port на реальный COM-порт/устройство,
;  которое покажет система при подключении платы. После первой
;  заливки (upload + uploadfs) дальше используй обычный env
;  [env:boiler-room] — он уже настроен на OTA. 117811.622 
; ============================================================
[env:boiler-room-usb]
extends = env:boiler-room
upload_protocol = esptool
upload_port = COM12

; ============================================================
;  mastergas — плата управления газовым котлом Daesung Master Gas Seoul
;  на WT32-ETH01 (пульт <-> котёл, протокол OpenMasterGas). Адрес 192.168.88.35.
;  Первая заливка на чистую плату — по USB: закомментируй upload_protocol
;  и upload_port ниже, раскомментируй COM-порт.
;  Не портировано из старого дерева (main): Telegram и captive portal.
; ============================================================
[env:mastergas]
platform = espressif32 @ 6.11.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_protocol = espota
upload_port = 192.168.88.35
; upload_port = COM5

board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs

lib_deps =
    ottowinter/ESPAsyncWebServer-esphome @ ^3.1.0
    esphome/AsyncTCP-esphome @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0
    knolleary/PubSubClient @ ^2.8

build_flags =
    -D CORE_DEBUG_LEVEL=3
    ; ---------- Модули ------------------------------------------
    -D MODULE_MQTT
    -D MODULE_OTA
    -D MODULE_TIME
    -D TIME_SOURCE_NTP
    ; ---------- Устройство --------------------------------------
    -D DEVICE_MASTERGAS
    ; ---------- Железо (WT32-ETH01) ------------------------------
    -D ETH_ADDR=1
    -D ETH_POWER_PIN=16
    -D ETH_MDC_PIN=23
    -D ETH_MDIO_PIN=18
    -D ETH_CLK_MODE=ETH_CLOCK_GPIO0_IN
    ; ---------- Include paths -----------------------------------
    -I src/core
    -I src/modules/mqtt
    -I src/modules/time
    -I src/devices/mastergas
